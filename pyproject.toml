[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trending-daily"
version = "0.1.0"
description = "Daily Chinese research digest for Agent-related GitHub Trending repositories."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "httpx>=0.28,<1",
    "openai>=2.0,<3",
    "pydantic>=2.11,<3",
    "PyYAML>=6.0,<7",
]

[project.scripts]
agent-trending = "agent_trending.cli:entrypoint"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
package = true
